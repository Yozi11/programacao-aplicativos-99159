<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Media dos alunos </title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>calculadora de media</h1>
        <div class="grupo-input">
            <label for="nota1">Nota da Primeira unidade</label>
            <input type="number" id="nota1" step="0.1" min="0" max="10" placeholder="Escreva sua nota Ex:7.5">
        <div>
        <div class="grupo-input">
            <label for="nota2">Nota da Segunda unidade</label>
            <input type="number" id="nota2" step="0.1" min="0" max="10" placeholder="Escreva sua nota Ex:8.0">
        <div>
         <div class="grupo-input">
            <label for="nota3">Nota da Terceira unidade</label>
            <input type="number" id="nota3" step="0.1" min="0" max="10" placeholder="Escreva sua nota Ex:5.5">

         </div>
         
        <button onclick="calcularMedia()">Calcular a media </button>
        
        <div id="resultado"></div>
        
    <script src="script.js"></script>
</body>
</html>
