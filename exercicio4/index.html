<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora de Médias</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <div class="card">
            <h1>Cálculo de Notas</h1>
            <p class="subtitle">Insira as 3 notas do aluno (valores entre 0 e 10).</p>
            
            <form id="formNotas">
                <div class="input-group">
                    <label for="nota1">Nota 1</label>
                    <input type="number" id="nota1" step="0.1" min="0" max="10" placeholder="Ex: 8.5" required>
                </div>
                
                <div class="input-group">
                    <label for="nota2">Nota 2</label>
                    <input type="number" id="nota2" step="0.1" min="0" max="10" placeholder="Ex: 7.0" required>
                </div>
                
                <div class="input-group">
                    <label for="nota3">Nota 3</label>
                    <input type="number" id="nota3" step="0.1" min="0" max="10" placeholder="Ex: 9.2" required>
                </div>
                
                <button type="submit">Calcular Média</button>
            </form>

            <div id="resultado" class="resultado oculto">
                </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
